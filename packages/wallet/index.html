<!doctype html>
<html lang="en" style="height: 100%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wallet · H5</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      /* Match native's system sans-serif. RSD renders html.* as real DOM
         nodes that inherit from body; without this they fall back to the
         browser default (serif), so text renders unlike native. */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* The app root is an RSD html.div with flexGrow:1; #root must be a flex
         column so that chain resolves to a real height (otherwise it collapses
         to 0 and the scrollable list renders no rows on web). */
      #root {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
